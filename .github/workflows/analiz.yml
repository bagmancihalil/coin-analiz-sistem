name: Otomatik Coin Analizi

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 🟢 BU SATIR KRİTİK: GitHub'ın kendi dosyalarını güncelleyebilmesi için şart
    steps:
      - name: 1. Proje Dosyalarını Çek
        uses: actions/checkout@v3

      - name: 2. Python Kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.10' 

      - name: 3. Gerekli Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      - name: 4. Analiz Script'ini Çalıştır
        run: python coin_backend/analyzer.py 

      - name: 5. Değişiklikleri Repoya Yükle
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add data.json
          git commit -m "📊 Otomatik analiz verileri güncellendi" || echo "Değişiklik yok"
          git push
